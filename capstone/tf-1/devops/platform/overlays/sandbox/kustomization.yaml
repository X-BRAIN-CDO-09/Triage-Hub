apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/hpa-patch.yaml
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: tf1-api-sa
        namespace: triage-hub
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::730335441285:role/triage-hub-tf1-api-irsa-sandbox
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: tf1-worker-sa
        namespace: triage-hub
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::730335441285:role/triage-hub-tf1-worker-irsa-sandbox
  # ⚠️  GIÁ TRỊ NÀY DO CI/CD TỰ ĐỘNG QUẢN LÝ — KHÔNG SỬA TAY
  # Sau mỗi lần terraform apply, GitHub Actions pipeline sẽ:
  #   1. Đọc ARN mới từ SSM: /triage-hub/sandbox/alb_target_group_arn
  #   2. Patch dòng targetGroupARN bên dưới
  #   3. Commit lên Git với message "[skip ci]"
  # Nếu cần lấy ARN thủ công: aws ssm get-parameter --name /triage-hub/sandbox/alb_target_group_arn
  - patch: |
      apiVersion: elbv2.k8s.aws/v1beta1
      kind: TargetGroupBinding
      metadata:
        name: tf1-api-tgb
        namespace: triage-hub
      spec:
        targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:730335441285:targetgroup/triage-hub-ai-tg-sandbox/7898d56906627e6e
  # queueURL thật lấy từ: terraform output (SQS module) — buffer/intake queue
  - patch: |
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: tf1-worker-scaler
        namespace: triage-hub
      spec:
        triggers:
          - type: aws-sqs-queue
            authenticationRef:
              name: keda-aws-sqs-auth
            metadata:
              queueURL: https://sqs.us-east-1.amazonaws.com/730335441285/triage-hub-buffer-queue.fifo
              queueLength: "5"
              awsRegion: us-east-1
              # identityOwner=operator: KEDA (podIdentity.provider=aws) LUÔN dùng identity
              # của keda-operator. Operator nay đã gắn IRSA role
              # triage-hub-keda-operator-irsa-sandbox (có sqs:GetQueueAttributes).
              # (Đã thử pod -> KHÔNG ăn vì AWS không ủy quyền sang workload role.)
              identityOwner: operator
images:
  - name: 730335441285.dkr.ecr.us-east-1.amazonaws.com/triage-hub-tf1-engine
    newTag: "e811e1e"
