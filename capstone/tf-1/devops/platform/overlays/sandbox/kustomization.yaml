apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/hpa-patch.yaml
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: tf1-api-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::730335441285:role/triage-hub-tf1-api-irsa-sandbox
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: tf1-worker-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::730335441285:role/triage-hub-tf1-worker-irsa-sandbox
