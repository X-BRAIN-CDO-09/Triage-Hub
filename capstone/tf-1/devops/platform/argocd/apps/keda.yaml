apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    targetRevision: 2.14.2
    chart: keda
    helm:
      # Gắn IRSA role cho SA keda-operator -> KEDA đọc được SQS GetQueueAttributes
      # (operator-IRSA pattern; thay cho node-role fallback gây AccessDenied 403).
      # Role tạo ở terraform: triage-hub-keda-operator-irsa-sandbox
      values: |
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::730335441285:role/triage-hub-keda-operator-irsa-sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
