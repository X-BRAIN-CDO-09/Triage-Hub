apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tf1-api-netpol
  namespace: triage-hub
spec:
  podSelector:
    matchLabels:
      app: tf1-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS (TCP & UDP)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to AWS endpoints (TCP 443)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Allow Prometheus/Loki evidence queries qua shim prometheus-operated (proxy EC2 :9000 -> :9090)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 9090
