apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tf1-worker-netpol
  namespace: triage-hub
spec:
  podSelector:
    matchLabels:
      app: tf1-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: [] # Deny all ingress
  egress:
    # Allow DNS (TCP & UDP)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to AWS endpoints (TCP 443)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
