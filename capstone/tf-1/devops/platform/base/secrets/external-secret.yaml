apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-engine-secrets
  namespace: triage-hub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-engine-secrets
    creationPolicy: Owner
  data:
    # Tên key khớp đúng env var app đọc (main.py:388, llm.py:165, aiops_worker.py:42-43)
    - secretKey: SERVICE_AUTH_TOKEN
      remoteRef:
        key: triage-hub/ai-engine
        property: SERVICE_AUTH_TOKEN
    - secretKey: BEDROCK_MODEL_ID
      remoteRef:
        key: triage-hub/ai-engine
        property: BEDROCK_MODEL_ID
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: SLACK_WEBHOOK_URL
    - secretKey: SQS_QUEUE_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: SQS_QUEUE_URL
