apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-engine-secrets
  namespace: triage-hub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-engine-secrets
    creationPolicy: Owner
  data:
    # SERVICE_AUTH_TOKEN: đọc từ secret STANDALONE plaintext (khớp file teammate
    # aws_secrets_samples.md #4). Đây là nơi team điền token; push-to-ai đọc cùng secret.
    # Lưu ý: tên có hậu tố -sandbox (env-specific) → prod patch qua overlay.
    - secretKey: SERVICE_AUTH_TOKEN
      remoteRef:
        key: triage-hub-service_auth_token-sandbox
    # Còn lại là CONFIG (không phải credential) → giữ ở triage-hub/ai-engine
    - secretKey: BEDROCK_MODEL_ID
      remoteRef:
        key: triage-hub/ai-engine
        property: BEDROCK_MODEL_ID
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: SLACK_WEBHOOK_URL
    - secretKey: SQS_QUEUE_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: SQS_QUEUE_URL
    # Thêm các keys mới đồng bộ từ Secrets Manager
    - secretKey: AIOPS_DYNAMODB_TABLE
      remoteRef:
        key: triage-hub/ai-engine
        property: AIOPS_DYNAMODB_TABLE
    - secretKey: PROMETHEUS_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: PROMETHEUS_URL
    - secretKey: LOKI_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: LOKI_URL
    - secretKey: JAEGER_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: JAEGER_URL
    - secretKey: TRIAGE_HUB_NOTIFY_SQS_URL
      remoteRef:
        key: triage-hub/ai-engine
        property: TRIAGE_HUB_NOTIFY_SQS_URL
    - secretKey: AGENTCORE_RUNTIME_ARN
      remoteRef:
        key: triage-hub/ai-engine
        property: AGENTCORE_RUNTIME_ARN
