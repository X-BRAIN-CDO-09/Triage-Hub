apiVersion: apps/v1
kind: Deployment
metadata:
  name: tf1-api
  namespace: triage-hub
  labels:
    app: tf1-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tf1-api
  template:
    metadata:
      labels:
        app: tf1-api
    spec:
      serviceAccountName: tf1-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-engine
          image: 730335441285.dkr.ecr.us-east-1.amazonaws.com/tf1-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "512m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: AIOPS_OBSERVABILITY_ENABLED
              value: "true"
            - name: BEDROCK_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: BEDROCK_MODEL
            - name: SERVICE_AUTO_TOKEN_BLOCK
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: SERVICE_AUTO_TOKEN_BLOCK
            - name: WEBSOCK_URL
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: WEBSOCK_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
