apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: triage-hub
  name: triage-hub-viewer
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
