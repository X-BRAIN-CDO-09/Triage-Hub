---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredlabels
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredLabels
      validation:
        openAPIV3Schema:
          type: object
          properties:
            labels:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredlabels

        violation[{"msg": msg}] {
          provided := {label | input.review.object.metadata.labels[label]}
          required := {label | label := input.parameters.labels[_]}
          missing := required - provided
          count(missing) > 0
          msg := sprintf("thiếu label bắt buộc: %v", [missing])
        }
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedtags
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedTags
      validation:
        openAPIV3Schema:
          type: object
          properties:
            disallowedTags:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowedtags

        violation[{"msg": msg}] {
          input.review.object.kind == "Pod"
          c := input.review.object.spec.containers[_]
          tag := input.parameters.disallowedTags[_]
          endswith(c.image, tag)
          msg := sprintf("container '%v' dùng tag bị cấm (%v) — bắt buộc tag bất biến (sha)", [c.name, tag])
        }

        violation[{"msg": msg}] {
          input.review.object.kind == "Pod"
          c := input.review.object.spec.containers[_]
          not contains(c.image, ":")
          msg := sprintf("container '%v' không có tag (mặc định :latest) — bắt buộc tag bất biến", [c.name])
        }
---
# Constraint tham chiếu chéo: kiểm tra Namespace có NetworkPolicy hay chưa.
# Cần Config resource (config-sync.yaml) đồng bộ Namespace + NetworkPolicy vào
# data.inventory để Rego truy vấn được.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenetworkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNetworkPolicy
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenetworkpolicy

        violation[{"msg": msg}] {
          input.review.object.kind == "Namespace"
          ns := input.review.object.metadata.name
          policies := data.inventory.namespace[ns]["networking.k8s.io/v1"]["NetworkPolicy"]
          count(policies) == 0
          msg := sprintf("namespace '%v' chưa có NetworkPolicy nào — vi phạm yêu cầu cách ly tenant", [ns])
        }
