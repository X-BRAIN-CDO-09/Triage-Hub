# Constraint instances áp dụng ConstraintTemplates vào namespace triage-hub.
#
# sync-wave = "0" (mặc định, KHÔNG phải "1"): Constraint không phụ thuộc gì vào
# vòng đời deploy của tf1-api/tf1-worker — chỉ cần ConstraintTemplate (wave -1)
# tồn tại trước. Nếu để wave "1" (sau Rollout), mỗi lần tf1-api đi qua canary
# pause bình thường (health=Suspended, KHÔNG phải lỗi) thì việc sync Constraint
# sẽ bị treo tạm thời theo — ghép nhầm 2 vòng đời độc lập với nhau. Constraint
# ở cùng wave với phần lớn resource khác trong base/ là đúng.
#
# enforcementAction: dryrun cho TẤT CẢ constraint mới ở lần rollout đầu tiên.
# Đây là rollout an toàn có chủ đích: Gatekeeper sẽ AUDIT và ghi vi phạm vào
# `status.violations` của từng Constraint (xem bằng `kubectl get <kind> <name>
# -o yaml`) nhưng KHÔNG chặn deploy. Sau khi xác nhận zero/known violations
# trong 1 chu kỳ audit, đổi enforcementAction sang "deny" theo từng constraint.
# Đây cũng chính là khác biệt so với việc bật "deny" ngay từ đầu cho policy
# chưa qua kiểm chứng trên workload thật — tránh biến 1 policy hạ tầng thành
# outage cho AI engine.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredSecurityContext
metadata:
  name: require-security-context
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["triage-hub"]
  parameters:
    # readOnlyRootFilesystem hiện = false ở tf1-api/tf1-worker (rollout.yaml,
    # ai-worker/deployment.yaml) -> để false trước, bật true sau khi hardening.
    requireReadOnlyRootFilesystem: false
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: allow-only-project-ecr
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["triage-hub"]
  parameters:
    repos:
      - "730335441285.dkr.ecr.us-east-1.amazonaws.com/"
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: require-resource-requests-limits
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["triage-hub"]
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredProbes
metadata:
  name: require-liveness-readiness-probes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["triage-hub"]
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: require-app-labels
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["triage-hub"]
  parameters:
    labels:
      - "app"
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowedTags
metadata:
  name: disallow-latest-and-untagged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["triage-hub"]
  parameters:
    disallowedTags:
      - ":latest"
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireNetworkPolicy
metadata:
  name: require-networkpolicy-per-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
    excludedNamespaces:
      - "kube-system"
      - "kube-node-lease"
      - "kube-public"
      - "argocd"
      - "gatekeeper-system"
      - "monitoring"
      - "default"
