global:
  resolve_timeout: 5m
  slack_api_url_file: '/etc/alertmanager/secrets/slack-webhook/url'
inhibit_rules:
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = critical
  target_matchers:
  - severity =~ warning|info
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = warning
  target_matchers:
  - severity = info
- equal:
  - namespace
  source_matchers:
  - alertname = InfoInhibitor
  target_matchers:
  - severity = info
- target_matchers:
  - alertname = InfoInhibitor
receivers:
- name: default-receiver
  slack_configs:
  - channel: '#alerts'
    send_resolved: true
    text: |-
      {{ range .Alerts -}} *Alert:* {{ .Labels.alertname }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }} *Description:* {{ .Annotations.description }} *Details:*
        {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
        {{ end }}
      {{ end }}
    title: "[{{ .Status | toUpper }}{{ if eq .Status \"firing\" }}:{{ .Alerts.Firing
      | len }}{{ end }}] {{ .GroupLabels.SortedPairs.Values | join \" \" }} {{ if
      eq .Status \"firing\" }}\U0001F525{{ else }}✅{{ end }}"
  webhook_configs:
  - send_resolved: true
    url: https://c1i3rj8lpd.execute-api.us-east-1.amazonaws.com/sandbox/alerts
route:
  group_by:
  - alertname
  - job
  group_interval: 5m
  group_wait: 30s
  receiver: default-receiver
  repeat_interval: 12h
  routes:
  - matchers:
    - alertname = "Watchdog"
    receiver: "null"
templates:
- /etc/alertmanager/config/*.tmpl