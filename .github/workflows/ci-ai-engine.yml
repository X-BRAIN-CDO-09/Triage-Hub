name: AI Engine CI/CD

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/app/ai-engine/**"
      - ".github/workflows/ci-ai-engine.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/app/ai-engine/**"
      - ".github/workflows/ci-ai-engine.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 730335441285.dkr.ecr.us-east-1.amazonaws.com
  # 1 image dùng chung cho api + worker (khác nhau ở command K8s).
  # Tên khớp ECR module: ${project_name}-${key} = triage-hub-tf1-engine
  ENGINE_REPOSITORY: triage-hub-tf1-engine
  APP_ROOT: capstone/tf-1/devops/app/ai-engine
  # Tag bất biến theo release engine (khớp handoff). KHÔNG dùng :latest cho
  # deployment (phá canary/rollback/cosign). Bump khi engine lên version mới.
  IMAGE_VERSION: v1.0.0

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "${{ env.APP_ROOT }}/requirements.txt"

      - name: Install QA Tools & Deps
        run: |
          python -m pip install --upgrade ruff pytest bandit
          python -m pip install -r ${{ env.APP_ROOT }}/requirements.txt

      - name: Ruff Lint Check
        run: ruff check ${{ env.APP_ROOT }}

      - name: Ruff Format Check
        run: ruff format --check ${{ env.APP_ROOT }}

      - name: Bandit Security Scan
        run: bandit -r ${{ env.APP_ROOT }} -ll

      - name: Run Unit Tests
        working-directory: ${{ env.APP_ROOT }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/${{ env.APP_ROOT }}:${PYTHONPATH:-}"
          pytest -v --tb=short

  build-scan-sign-push:
    name: Build, Scan, Push & Cosign Sign
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Engine Image
        id: build-image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ENGINE_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${SHORT_SHA}"

          # 1 image dùng chung cho api & worker (tag :<sha> truy vết + :v1.0.0 cho deployment)
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "$ENGINE_IMAGE" \
            -t "${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${{ env.IMAGE_VERSION }}" \
            -f ${{ env.APP_ROOT }}/Dockerfile \
            ${{ env.APP_ROOT }}

          echo "engine_image=$ENGINE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${{ env.IMAGE_VERSION }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push Engine Image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${SHORT_SHA}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${{ env.IMAGE_VERSION }}"

      - name: Keyless Sign Image with Cosign
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ENGINE_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${SHORT_SHA}"

          cosign sign --yes \
            --rekor-url https://rekor.sigstore.dev \
            --fulcio-url https://fulcio.sigstore.dev \
            "$ENGINE_IMAGE"
