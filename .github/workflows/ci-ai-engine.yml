name: AI Engine CI/CD

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/app/ai-engine/**"
      - ".github/workflows/ci-ai-engine.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/app/ai-engine/**"
      - ".github/workflows/ci-ai-engine.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 730335441285.dkr.ecr.us-east-1.amazonaws.com
  # 1 image dùng chung cho api + worker (khác nhau ở command K8s).
  # Tên khớp ECR module: ${project_name}-${key} = triage-hub-tf1-engine
  ENGINE_REPOSITORY: triage-hub-tf1-engine
  APP_ROOT: capstone/tf-1/devops/app/ai-engine
  # Tag bất biến theo release engine (khớp handoff). KHÔNG dùng :latest cho
  # deployment (phá canary/rollback/cosign). Bump khi engine lên version mới.
  IMAGE_VERSION: v1.0.0

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "${{ env.APP_ROOT }}/requirements.txt"

      - name: Install QA Tools & Deps
        run: |
          python -m pip install --upgrade ruff pytest bandit
          python -m pip install -r ${{ env.APP_ROOT }}/requirements.txt

      - name: Ruff Lint Check
        run: ruff check ${{ env.APP_ROOT }}

      - name: Ruff Format Check
        run: ruff format --check ${{ env.APP_ROOT }}

      - name: Bandit Security Scan
        run: bandit -r ${{ env.APP_ROOT }} -ll

      - name: Run Unit Tests
        working-directory: ${{ env.APP_ROOT }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/${{ env.APP_ROOT }}:${PYTHONPATH:-}"
          pytest -v --tb=short

  build-scan-sign-push:
    name: Build, Scan, Push & Cosign Sign
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Engine Image
        id: build-image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ENGINE_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${SHORT_SHA}"

          # 1 image dùng chung cho api & worker (tag :<sha> truy vết)
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "$ENGINE_IMAGE" \
            -f ${{ env.APP_ROOT }}/Dockerfile \
            ${{ env.APP_ROOT }}

          echo "engine_image=$ENGINE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${{ steps.build-image.outputs.short_sha }}

          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push Engine Image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${SHORT_SHA}"


      - name: Keyless Sign Image with Cosign
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ENGINE_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ENGINE_REPOSITORY }}:${SHORT_SHA}"

          cosign sign --yes \
            --rekor-url https://rekor.sigstore.dev \
            --fulcio-url https://fulcio.sigstore.dev \
            "$ENGINE_IMAGE"

      # Tự động bump newTag trong overlay sandbox -> ArgoCD (track develop) sync image mới.
      # Chỉ chạy khi push lên develop/main (không chạy PR). Commit [skip ci] + đổi file
      # ở platform/** nên KHÔNG kích hoạt lại workflow nào (tránh loop).
      - name: Bump engine image tag in overlay
        if: github.event_name == 'push'
        env:
          OVERLAY: capstone/tf-1/devops/platform/overlays/sandbox/kustomization.yaml
          # PAT/GitHub App token của identity ĐƯỢC PHÉP bypass branch protection trên develop.
          # Quyền tối thiểu: contents:write. Chủ token PHẢI nằm trong bypass list của ruleset develop.
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i -E "s|(newTag:[[:space:]]*).*|\1\"${SHORT_SHA}\"|" "$OVERLAY"
          if git diff --quiet -- "$OVERLAY"; then
            echo "newTag đã đúng ${SHORT_SHA}, không cần commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY"
          git commit -m "ci(ai-engine): bump engine image -> ${SHORT_SHA} [skip ci]"
          if [ -n "$GITOPS_PAT" ]; then
            # Push qua identity có quyền bypass -> vượt branch protection trên develop.
            # (GitHub Actions tự mask giá trị secret trong log.)
            git push "https://x-access-token:${GITOPS_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          else
            echo "::warning::Chưa cấu hình secret GITOPS_PAT — thử push bằng GITHUB_TOKEN (sẽ bị chặn nếu develop protected)."
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Đã bump overlay newTag -> ${SHORT_SHA} và push lên ${GITHUB_REF_NAME}."
