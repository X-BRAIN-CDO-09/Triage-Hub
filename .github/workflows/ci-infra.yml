name: Infra CI/CD

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/infra/**"
      - ".github/workflows/ci-infra.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/infra/**"
      - ".github/workflows/ci-infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Terraform environment"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
      apply:
        description: "Apply after a successful plan"
        required: true
        default: false
        type: boolean
      confirm:
        description: 'Type "apply-sandbox" to confirm apply'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: "1.14.8"
  TF_ROOT: capstone/tf-1/devops/infra/environments/sandbox
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'triage-hub-tfstate-bucket' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_environment: ${{ vars.TF_ENVIRONMENT || 'sandbox' }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'triage-hub' }}
  TF_VAR_platform_vpc_cidr: ${{ vars.PLATFORM_VPC_CIDR || '10.0.0.0/16' }}
  TF_VAR_platform_public_subnets: ${{ vars.PLATFORM_PUBLIC_SUBNETS || '["10.0.1.0/24", "10.0.2.0/24"]' }}
  TF_VAR_platform_private_subnets: ${{ vars.PLATFORM_PRIVATE_SUBNETS || '["10.0.10.0/24", "10.0.11.0/24"]' }}
  TF_VAR_customer_vpc_cidr: ${{ vars.CUSTOMER_VPC_CIDR || '10.1.0.0/16' }}
  TF_VAR_customer_public_subnets: ${{ vars.CUSTOMER_PUBLIC_SUBNETS || '["10.1.1.0/24"]' }}
  TF_VAR_customer_instance_type: ${{ vars.CUSTOMER_INSTANCE_TYPE || 't3.large' }}
  TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION || '1.30' }}
  TF_VAR_node_instance_types: ${{ vars.NODE_INSTANCE_TYPES || '["t3.large"]' }}
  TF_VAR_node_scaling: ${{ vars.NODE_SCALING || '{"min_size":2,"max_size":4,"desired_size":2}' }}
  TF_VAR_public_access_cidrs: ${{ vars.PUBLIC_ACCESS_CIDRS || '["0.0.0.0/0"]' }}

jobs:
  terraform-static-checks:
    name: Terraform format, validate, scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform format check
        run: |
          set +e
          terraform fmt -check -recursive -diff capstone/tf-1/devops/infra
          FMT_EXIT=$?
          set -e

          echo ""
          echo "========================================="
          echo "Terraform fmt exit code: $FMT_EXIT"
          echo "0 = formatted, 3 = formatting changes needed"
          echo "========================================="

          if [ "$FMT_EXIT" -eq 3 ]; then
            echo "::error::Terraform files are not formatted. Run: terraform fmt -recursive capstone/tf-1/devops/infra"
          fi

          exit "$FMT_EXIT"

      - name: Terraform validate modules
        run: |
          set -euo pipefail
          for dir in capstone/tf-1/devops/infra/modules/*; do
            [ -d "$dir" ] || continue
            if find "$dir" -maxdepth 1 -name '*.tf' -print -quit | grep -q .; then
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            fi
          done

      - name: Terraform validate sandbox root
        run: |
          terraform -chdir="$TF_ROOT" init -backend=false -input=false
          terraform -chdir="$TF_ROOT" validate

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: capstone/tf-1/devops/infra
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: capstone/tf-1/devops/infra
          framework: terraform
          soft_fail: true
          quiet: true

  terraform-plan:
    name: Terraform plan sandbox
    needs: terraform-static-checks
    runs-on: ubuntu-latest
    environment: sandbox
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Bootstrap remote state backend
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "S3 state bucket exists: $TF_STATE_BUCKET"
          else
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi

            aws s3api put-bucket-versioning \
              --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Clean deprecated K8s resources from state
        run: |
          set +e
          echo "🧹 Cleaning deprecated resources from state..."
          terraform state rm terraform_data.argocd_root || true
          terraform state rm helm_release.argocd || true
          terraform state rm module.otel_collector.helm_release.opentelemetry_collector || true
          terraform state rm module.prometheus.helm_release.kube_prometheus_stack || true
          terraform state rm module.prometheus.kubernetes_config_map_v1.grafana_application_dashboard || true
          terraform state rm module.prometheus.kubernetes_config_map_v1.grafana_business_dashboard || true
          terraform state rm module.prometheus.kubernetes_config_map_v1.grafana_executive_dashboard || true
          set -e

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -detailed-exitcode -out=tfplan
          PLAN_EXIT=$?
          set -e

          if [ "$PLAN_EXIT" -eq 1 ]; then
            exit 1
          fi

          if [ "$PLAN_EXIT" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-sandbox-plan
          path: |
            ${{ env.TF_ROOT }}/tfplan
            ${{ env.TF_ROOT }}/tfplan.txt
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.TF_ROOT}/tfplan.txt`, 'utf8');
            const body = [
              '### Terraform sandbox plan',
              '',
              '```',
              plan.slice(-60000),
              '```'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  terraform-apply:
    name: Terraform apply sandbox
    needs: terraform-plan
    if: |
      needs.terraform-plan.outputs.has_changes == 'true' &&
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.apply == 'true' &&
          github.event.inputs.confirm == 'apply-sandbox'
        )
      )
    runs-on: ubuntu-latest
    environment: sandbox
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-sandbox-plan
          path: ${{ env.TF_ROOT }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: Export deployment outputs
        run: terraform output -no-color || true

  # ====================================================================== #
  # Stage 2: Bootstrap ArgoCD                                              #
  # Chạy RIÊNG sau terraform-apply với token EKS MỚI → không bao giờ     #
  # bị lỗi token hết hạn như khi dùng helm_release trong Terraform        #
  # ====================================================================== #
  bootstrap-argocd:
    name: Bootstrap ArgoCD vào EKS
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: write
      id-token: write

    env:
      CLUSTER_NAME: triage-hub-eks
      ARGOCD_NAMESPACE: argocd
      ARGOCD_CHART_VERSION: "7.8.26"
      ROOT_APP_PATH: capstone/tf-1/devops/platform/argocd/root-app.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: Cập nhật kubeconfig (token MỚI - không bị hết hạn)
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"
          echo "✅ kubeconfig đã được cập nhật"
          kubectl cluster-info

      - name: Cài ArgoCD qua Helm (idempotent - an toàn chạy lại nhiều lần)
        run: |
          set -euo pipefail

          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          helm upgrade --install argocd argo/argo-cd \
            --namespace "$ARGOCD_NAMESPACE" \
            --create-namespace \
            --version "$ARGOCD_CHART_VERSION" \
            --set server.service.type=ClusterIP \
            --wait \
            --timeout 5m

          echo "✅ ArgoCD đã cài xong"
          kubectl get pods -n "$ARGOCD_NAMESPACE"

      - name: Apply ArgoCD Root App (App of Apps)
        run: |
          set -euo pipefail

          # Chờ ArgoCD CRDs sẵn sàng
          kubectl wait --for=condition=established \
            crd/applications.argoproj.io \
            --timeout=60s

          kubectl apply -f "$ROOT_APP_PATH"
          echo "✅ Root App đã được apply - ArgoCD sẽ tự sync các app còn lại"

      - name: Kiểm tra trạng thái ArgoCD
        run: |
          echo "=== ArgoCD Pods ==="
          kubectl get pods -n "$ARGOCD_NAMESPACE"
          echo ""
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n "$ARGOCD_NAMESPACE" || true

      # ------------------------------------------------------------------ #
      # Auto-patch: Đọc ARN từ SSM và cập nhật vào kustomization.yaml     #
      # Mỗi lần terraform apply tạo lại ALB, bước này tự động commit ARN mới  #
      # ------------------------------------------------------------------ #
      - name: Checkout full repo (for git push)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials (re-auth for SSM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Patch kustomization.yaml với ARN mới từ SSM
        env:
          KUSTOMIZATION_FILE: capstone/tf-1/devops/platform/overlays/sandbox/kustomization.yaml
          SSM_PARAM: /triage-hub/sandbox/alb_target_group_arn
        run: |
          set -euo pipefail

          # Kiểm tra xem file kustomization.yaml có dòng targetGroupARN không (tránh patch trượt âm thầm)
          if ! grep -q "targetGroupARN:" "$KUSTOMIZATION_FILE"; then
            echo "❌ Error: Không tìm thấy targetGroupARN trong file $KUSTOMIZATION_FILE"
            exit 1
          fi

          # Đọc ARN từ SSM
          ARN=$(aws ssm get-parameter \
            --name "$SSM_PARAM" \
            --query 'Parameter.Value' \
            --output text)

          echo "✅ ARN lấy từ SSM: $ARN"

          # Patch vào kustomization.yaml (chỉ thay dòng có targetGroupARN)
          sed -i "s|targetGroupARN:.*|targetGroupARN: ${ARN}|" "$KUSTOMIZATION_FILE"

          echo "✅ kustomization.yaml sau patch:"
          grep -A2 'targetGroupARN' "$KUSTOMIZATION_FILE"

      - name: Commit và push ARN mới lên Git
        env:
          KUSTOMIZATION_FILE: capstone/tf-1/devops/platform/overlays/sandbox/kustomization.yaml
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Chỉ commit nếu file thực sự thay đổi (tránh empty commit)
          if git diff --quiet "$KUSTOMIZATION_FILE"; then
            echo "ℹ️ ARN không thay đổi, bỏ qua bước commit."
          else
            git add "$KUSTOMIZATION_FILE"
            git commit -m "ci(infra): auto-patch targetGroupARN từ SSM [skip ci]"
            # Sử dụng HEAD:<branch_name> để push an toàn cả khi ở trạng thái detached HEAD
            git push origin HEAD:"$BRANCH_NAME"
            echo "✅ Đã push ARN mới lên branch $BRANCH_NAME"
          fi
