name: Infra CI/CD

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/infra/**"
      - ".github/workflows/ci-infra.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/infra/**"
      - ".github/workflows/ci-infra.yml"
  schedule:
    # 07:17 ICT (UTC+7) every day
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Terraform environment"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
      apply:
        description: "Apply after a successful plan"
        required: true
        default: false
        type: boolean
      deploy_app_after_apply:
        description: "Also run App CI deploy after Terraform apply"
        required: true
        default: false
        type: boolean
      confirm:
        description: 'Type "apply-sandbox" to confirm apply'
        required: true
        type: string
permissions:
  actions: write
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: "1.14.8"
  TF_LOCK_TIMEOUT: "10m"
  TF_ROOT: capstone/tf-1/devops/infra/environments/sandbox
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'triage-hub-tfstate-bucket' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_environment: ${{ vars.TF_ENVIRONMENT || 'sandbox' }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'triage-hub' }}
  TF_VAR_platform_vpc_cidr: ${{ vars.PLATFORM_VPC_CIDR || '10.0.0.0/16' }}
  TF_VAR_platform_public_subnets: ${{ vars.PLATFORM_PUBLIC_SUBNETS || '["10.0.1.0/24", "10.0.2.0/24"]' }}
  TF_VAR_platform_private_subnets: ${{ vars.PLATFORM_PRIVATE_SUBNETS || '["10.0.10.0/24", "10.0.11.0/24"]' }}
  TF_VAR_customer_vpc_cidr: ${{ vars.CUSTOMER_VPC_CIDR || '10.1.0.0/16' }}
  TF_VAR_customer_public_subnets: ${{ vars.CUSTOMER_PUBLIC_SUBNETS || '["10.1.1.0/24"]' }}
  TF_VAR_customer_instance_type: ${{ vars.CUSTOMER_INSTANCE_TYPE || 't3.large' }}
  TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION || '1.30' }}
  TF_VAR_node_instance_types: ${{ vars.NODE_INSTANCE_TYPES || '["t3.large"]' }}
  TF_VAR_node_scaling: ${{ vars.NODE_SCALING || '{"min_size":2,"max_size":4,"desired_size":2}' }}
  TF_VAR_public_access_cidrs: ${{ vars.PUBLIC_ACCESS_CIDRS || '["0.0.0.0/0"]' }}

jobs:
  terraform-static-checks:
    name: Terraform format, validate, scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: terraform fmt -recursive capstone/tf-1/devops/infra

      - name: Terraform format check
        run: |
          set +e
          terraform fmt -check -recursive -diff capstone/tf-1/devops/infra
          FMT_EXIT=$?
          set -e

          echo ""
          echo "========================================="
          echo "Terraform fmt exit code: $FMT_EXIT"
          echo "0 = formatted, 3 = formatting changes needed"
          echo "========================================="

          if [ "$FMT_EXIT" -eq 3 ]; then
            echo "::error::Terraform files are not formatted. Run: terraform fmt -recursive capstone/tf-1/devops/infra"
          fi

          exit "$FMT_EXIT"

      - name: Terraform validate modules
        run: |
          set -euo pipefail
          for dir in capstone/tf-1/devops/infra/modules/*; do
            [ -d "$dir" ] || continue
            if find "$dir" -maxdepth 1 -name '*.tf' -print -quit | grep -q .; then
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            fi
          done

      - name: Terraform validate sandbox root
        run: |
          terraform -chdir="$TF_ROOT" init -backend=false -input=false
          terraform -chdir="$TF_ROOT" validate

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: capstone/tf-1/devops/infra
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: capstone/tf-1/devops/infra
          framework: terraform
          soft_fail: true
          quiet: true

  terraform-plan:
    name: Terraform plan sandbox
    needs: terraform-static-checks
    runs-on: ubuntu-latest
    environment: sandbox
    concurrency:
      group: terraform-sandbox-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Bootstrap remote state backend
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "S3 state bucket exists: $TF_STATE_BUCKET"
          else
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi

            aws s3api put-bucket-versioning \
              --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Prepare Lambda zip output directory
        run: mkdir -p ../../modules/lambda/files

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -lock-timeout="$TF_LOCK_TIMEOUT" -detailed-exitcode -out=tfplan
          PLAN_EXIT=$?
          set -e

          if [ "$PLAN_EXIT" -eq 1 ]; then
            exit 1
          fi

          if [ "$PLAN_EXIT" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-sandbox-plan
          path: |
            ${{ env.TF_ROOT }}/tfplan
            ${{ env.TF_ROOT }}/tfplan.txt
          retention-days: 7

      - name: Upload generated Lambda zips
        uses: actions/upload-artifact@v4
        with:
          name: terraform-lambda-zips
          path: capstone/tf-1/devops/infra/modules/lambda/files/*_payload.zip
          if-no-files-found: error
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.TF_ROOT}/tfplan.txt`, 'utf8');
            const body = [
              '### Terraform sandbox plan',
              '',
              '```',
              plan.slice(-60000),
              '```'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  terraform-apply:
    name: Terraform apply sandbox
    needs: terraform-plan
    if: |
      needs.terraform-plan.outputs.has_changes == 'true' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/develop' ||
            github.ref == 'refs/heads/main'
          )
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.apply == 'true' &&
          github.event.inputs.confirm == 'apply-sandbox'
        )
      )
    runs-on: ubuntu-latest
    environment: sandbox
    concurrency:
      group: terraform-sandbox-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-sandbox-plan
          path: ${{ env.TF_ROOT }}

      - name: Download generated Lambda zips
        uses: actions/download-artifact@v4
        with:
          name: terraform-lambda-zips
          path: capstone/tf-1/devops/infra/modules/lambda/files

      - name: Terraform init
        run: terraform init -input=false

      - name: Prepare Lambda zip output directory
        run: mkdir -p ../../modules/lambda/files

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -lock-timeout="$TF_LOCK_TIMEOUT" tfplan

      - name: Export deployment outputs
        run: terraform output -no-color || true

  dispatch-app-ci:
    name: Trigger App CI deploy
    needs: terraform-apply
    if: |
      needs.terraform-apply.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_app_after_apply == 'true'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch App CI workflow
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-app.yml',
              ref,
              inputs: {
                deploy: 'true'
              }
            });
            core.info(`Dispatched App CI/CD on ${ref} with deploy=true`);

  # ====================================================================== #
  # Stage 2: Bootstrap ArgoCD                                              #
  # Chạy RIÊNG sau terraform-apply với token EKS MỚI → không bao giờ     #
  # bị lỗi token hết hạn như khi dùng helm_release trong Terraform        #
  # ====================================================================== #
  bootstrap-argocd:
    name: Bootstrap ArgoCD vào EKS
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: write
      id-token: write

    env:
      CLUSTER_NAME: triage-hub-eks
      ARGOCD_NAMESPACE: argocd
      ARGOCD_CHART_VERSION: "7.8.26"
      ROOT_APP_PATH: capstone/tf-1/devops/platform/argocd/root-app.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: Cập nhật kubeconfig (token MỚI - không bị hết hạn)
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"
          echo "✅ kubeconfig đã được cập nhật"
          kubectl cluster-info

      - name: Cài ArgoCD qua Helm (idempotent - an toàn chạy lại nhiều lần)
        run: |
          set -euo pipefail

          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          helm upgrade --install argocd argo/argo-cd \
            --namespace "$ARGOCD_NAMESPACE" \
            --create-namespace \
            --version "$ARGOCD_CHART_VERSION" \
            --set server.service.type=ClusterIP \
            --wait \
            --timeout 5m

          echo "✅ ArgoCD đã cài xong"
          kubectl get pods -n "$ARGOCD_NAMESPACE"

      - name: Apply ArgoCD Root App (App of Apps)
        env:
          PROJECTS_PATH: capstone/tf-1/devops/platform/argocd/projects
        run: |
          set -euo pipefail

          # Chờ ArgoCD CRDs sẵn sàng (Application + AppProject)
          kubectl wait --for=condition=established \
            crd/applications.argoproj.io \
            crd/appprojects.argoproj.io \
            --timeout=60s

          # PHẢI apply AppProject TRƯỚC root-app: triage-hub-app tham chiếu
          # project "triage-hub"; nếu project chưa tồn tại -> InvalidSpecError,
          # app không sync -> engine không deploy. root-app chỉ sync path apps/
          # nên projects/ không bao giờ được tạo nếu không apply ở đây.
          kubectl apply -f "$PROJECTS_PATH"
          echo "✅ AppProject đã được apply"

          kubectl apply -f "$ROOT_APP_PATH"
          echo "✅ Root App đã được apply - ArgoCD sẽ tự sync các app còn lại"

      - name: Kiểm tra trạng thái ArgoCD
        run: |
          echo "=== ArgoCD Pods ==="
          kubectl get pods -n "$ARGOCD_NAMESPACE"
          echo ""
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n "$ARGOCD_NAMESPACE" || true

      # ------------------------------------------------------------------ #
      # Auto-patch: Đọc IP/ARN từ SSM và cập nhật manifest trong Git       #
      # GitOps hoá: KHÔNG kubectl apply thủ công nữa — chỉ commit giá trị  #
      # mới vào Git, ArgoCD (automated + selfHeal) sẽ tự sync phần còn lại #
      # ------------------------------------------------------------------ #
      - name: Checkout full repo (for git push)
        uses: actions/checkout@v4
        with:
          # GITOPS_PAT (owner nằm trong bypass list của ruleset develop) để git push
          # ARN auto-patch vượt qua branch protection. Fallback GITHUB_TOKEN nếu chưa
          # cấu hình secret — nhưng sẽ bị chặn nếu develop protected (GH013).
          token: ${{ secrets.GITOPS_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials (re-auth for SSM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render Prometheus/Loki external Service manifests từ SSM IP
        env:
          SSM_PARAM: /triage-hub/sandbox/prometheus_ip
        run: |
          set -euo pipefail

          # EC2 monitoring duy nhất chạy cả Prometheus (NodePort 9090) và Loki
          # (NodePort 3100), gộp qua Nginx cổng 9000 — cùng 1 IP cho cả 2 Endpoints.
          MONITORING_IP=$(aws ssm get-parameter \
            --name "$SSM_PARAM" \
            --query 'Parameter.Value' \
            --output text)

          echo "✅ IP EC2 monitoring lấy từ SSM: $MONITORING_IP"

          cp capstone/tf-1/devops/platform/base/ai-engine/prometheus-service.yaml.template \
             capstone/tf-1/devops/platform/base/ai-engine/prometheus-external-service.yaml
          sed -i "s|PROMETHEUS_IP_PLACEHOLDER|${MONITORING_IP}|" \
             capstone/tf-1/devops/platform/base/ai-engine/prometheus-external-service.yaml

          cp capstone/tf-1/devops/platform/base/ai-engine/loki-service.yaml.template \
             capstone/tf-1/devops/platform/base/ai-engine/loki-external-service.yaml
          sed -i "s|LOKI_IP_PLACEHOLDER|${MONITORING_IP}|" \
             capstone/tf-1/devops/platform/base/ai-engine/loki-external-service.yaml

          echo "✅ Đã render Service/Endpoints Prometheus + Loki với IP mới (chưa apply, sẽ commit vào Git)"

      - name: Patch kustomization.yaml với ARN mới từ SSM
        env:
          KUSTOMIZATION_FILE: capstone/tf-1/devops/platform/overlays/sandbox/kustomization.yaml
          SSM_PARAM: /triage-hub/sandbox/alb_target_group_arn
        run: |
          set -euo pipefail

          # Kiểm tra xem file kustomization.yaml có dòng targetGroupARN không (tránh patch trượt âm thầm)
          if ! grep -q "targetGroupARN:" "$KUSTOMIZATION_FILE"; then
            echo "❌ Error: Không tìm thấy targetGroupARN trong file $KUSTOMIZATION_FILE"
            exit 1
          fi

          # Đọc ARN từ SSM
          ARN=$(aws ssm get-parameter \
            --name "$SSM_PARAM" \
            --query 'Parameter.Value' \
            --output text)

          echo "✅ ARN lấy từ SSM: $ARN"

          # Patch vào kustomization.yaml (chỉ thay dòng có targetGroupARN)
          sed -i "s|targetGroupARN:.*|targetGroupARN: ${ARN}|" "$KUSTOMIZATION_FILE"

          echo "✅ kustomization.yaml sau patch:"
          grep -A2 'targetGroupARN' "$KUSTOMIZATION_FILE"

      - name: Commit và push IP/ARN mới lên Git
        env:
          KUSTOMIZATION_FILE: capstone/tf-1/devops/platform/overlays/sandbox/kustomization.yaml
          PROMETHEUS_MANIFEST: capstone/tf-1/devops/platform/base/ai-engine/prometheus-external-service.yaml
          LOKI_MANIFEST: capstone/tf-1/devops/platform/base/ai-engine/loki-external-service.yaml
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$KUSTOMIZATION_FILE" "$PROMETHEUS_MANIFEST" "$LOKI_MANIFEST"

          # Chỉ commit nếu có gì đó thực sự thay đổi (tránh empty commit)
          if git diff --cached --quiet; then
            echo "ℹ️ IP/ARN không thay đổi, bỏ qua bước commit."
          else
            git commit -m "ci(infra): auto-patch targetGroupARN + Prometheus/Loki IP từ SSM [skip ci]"
            # Sử dụng HEAD:<branch_name> để push an toàn cả khi ở trạng thái detached HEAD
            git push origin HEAD:"$BRANCH_NAME"
            echo "✅ Đã push IP/ARN mới lên branch $BRANCH_NAME"
          fi
