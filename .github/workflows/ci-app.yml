name: App CI/CD

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/app/alert-ingest/**"
      - "capstone/tf-1/devops/app/alert-ingestion/**"
      - "capstone/tf-1/devops/app/broadcast-notifier/**"
      - "capstone/tf-1/devops/app/context-collector/**"
      - "capstone/tf-1/devops/app/jira-dispatcher/**"
      - "capstone/tf-1/devops/app/jira-connector/**"
      - "capstone/tf-1/devops/app/notify-dispatcher/**"
      - "capstone/tf-1/devops/app/push-to-ai/**"
      - "capstone/tf-1/devops/app/slack-dispatcher/**"
      - "capstone/tf-1/devops/app/slack-notifier/**"
      - "capstone/tf-1/devops/app/shared/**"
      - ".github/workflows/ci-app.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "capstone/tf-1/devops/app/alert-ingest/**"
      - "capstone/tf-1/devops/app/alert-ingestion/**"
      - "capstone/tf-1/devops/app/broadcast-notifier/**"
      - "capstone/tf-1/devops/app/context-collector/**"
      - "capstone/tf-1/devops/app/jira-dispatcher/**"
      - "capstone/tf-1/devops/app/jira-connector/**"
      - "capstone/tf-1/devops/app/notify-dispatcher/**"
      - "capstone/tf-1/devops/app/push-to-ai/**"
      - "capstone/tf-1/devops/app/slack-dispatcher/**"
      - "capstone/tf-1/devops/app/slack-notifier/**"
      - "capstone/tf-1/devops/app/shared/**"
      - ".github/workflows/ci-app.yml"
  workflow_run:
    workflows: ["Infra CI/CD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy changed artifacts after build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PYTHON_VERSION: "3.12"
  APP_ROOT: capstone/tf-1/devops/app
  APP_LINT_ROOTS: >-
    capstone/tf-1/devops/app/alert-ingest
    capstone/tf-1/devops/app/alert-ingestion
    capstone/tf-1/devops/app/broadcast-notifier
    capstone/tf-1/devops/app/context-collector
    capstone/tf-1/devops/app/jira-dispatcher
    capstone/tf-1/devops/app/jira-connector
    capstone/tf-1/devops/app/notify-dispatcher
    capstone/tf-1/devops/app/push-to-ai
    capstone/tf-1/devops/app/slack-dispatcher
    capstone/tf-1/devops/app/slack-notifier
    capstone/tf-1/devops/app/shared

jobs:
  detect-changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app }}
      lambdas: ${{ steps.filter.outputs.lambdas }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'capstone/tf-1/devops/app/alert-ingest/**'
              - 'capstone/tf-1/devops/app/alert-ingestion/**'
              - 'capstone/tf-1/devops/app/broadcast-notifier/**'
              - 'capstone/tf-1/devops/app/context-collector/**'
              - 'capstone/tf-1/devops/app/jira-dispatcher/**'
              - 'capstone/tf-1/devops/app/jira-connector/**'
              - 'capstone/tf-1/devops/app/notify-dispatcher/**'
              - 'capstone/tf-1/devops/app/push-to-ai/**'
              - 'capstone/tf-1/devops/app/slack-dispatcher/**'
              - 'capstone/tf-1/devops/app/slack-notifier/**'
              - 'capstone/tf-1/devops/app/shared/**'
            lambdas:
              - 'capstone/tf-1/devops/app/alert-ingest/**'
              - 'capstone/tf-1/devops/app/broadcast-notifier/**'
              - 'capstone/tf-1/devops/app/context-collector/**'
              - 'capstone/tf-1/devops/app/jira-dispatcher/**'
              - 'capstone/tf-1/devops/app/jira-connector/**'
              - 'capstone/tf-1/devops/app/notify-dispatcher/**'
              - 'capstone/tf-1/devops/app/push-to-ai/**'
              - 'capstone/tf-1/devops/app/slack-dispatcher/**'
              - 'capstone/tf-1/devops/app/slack-notifier/**'
              - 'capstone/tf-1/devops/app/shared/**'
            shared:
              - 'capstone/tf-1/devops/app/shared/**'

  lint-test:
    name: Lint, unit test, secret scan
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.app_changed == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve app integration roots
        run: |
          {
            echo "APP_CHECK_ROOTS<<EOF"
            for dir in $APP_LINT_ROOTS; do
              [ -d "$dir" ] && echo "$dir"
            done
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Detect Python dependency manifests
        id: python-deps
        run: |
          if find $APP_CHECK_ROOTS \( -name requirements.txt -o -name pyproject.toml \) -print -quit | grep -q .; then
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python with pip cache
        if: steps.python-deps.outputs.has_manifest == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            capstone/tf-1/devops/app/alert-*/requirements.txt
            capstone/tf-1/devops/app/context-collector/requirements.txt
            capstone/tf-1/devops/app/jira-*/requirements.txt
            capstone/tf-1/devops/app/notify-dispatcher/requirements.txt
            capstone/tf-1/devops/app/push-to-ai/requirements.txt
            capstone/tf-1/devops/app/slack-*/requirements.txt
            capstone/tf-1/devops/app/shared/requirements.txt
            capstone/tf-1/devops/app/alert-*/pyproject.toml
            capstone/tf-1/devops/app/context-collector/pyproject.toml
            capstone/tf-1/devops/app/jira-*/pyproject.toml
            capstone/tf-1/devops/app/notify-dispatcher/pyproject.toml
            capstone/tf-1/devops/app/push-to-ai/pyproject.toml
            capstone/tf-1/devops/app/slack-*/pyproject.toml
            capstone/tf-1/devops/app/shared/pyproject.toml

      - name: Setup Python without pip cache
        if: steps.python-deps.outputs.has_manifest != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python QA tools
        run: |
          python -m pip install --upgrade pip ruff pytest bandit

          while IFS= read -r requirements_file; do
            echo "Installing dependencies from $requirements_file"
            python -m pip install -r "$requirements_file"
          done < <(find $APP_CHECK_ROOTS -name requirements.txt -print)

          while IFS= read -r pyproject_file; do
            echo "Installing dependencies declared in $pyproject_file"
            python - "$pyproject_file" <<'PY'
          import subprocess
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as handle:
              data = tomllib.load(handle)

          project = data.get("project", {})
          dependencies = list(project.get("dependencies", []))

          optional = project.get("optional-dependencies", {})
          for group in ("test", "tests", "dev"):
              dependencies.extend(optional.get(group, []))

          if dependencies:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY
          done < <(find $APP_CHECK_ROOTS -name pyproject.toml -print)


      - name: Ruff lint
        run: |
          if find $APP_CHECK_ROOTS -name '*.py' -print -quit | grep -q .; then
            ruff check $APP_CHECK_ROOTS --output-format=github
          else
            echo "No Python source found under app integration roots; skipping ruff."
          fi

      - name: Ruff format check
        run: |
          if find $APP_CHECK_ROOTS -name '*.py' -print -quit | grep -q .; then
            ruff format --check $APP_CHECK_ROOTS
          else
            echo "No Python source found under app integration roots; skipping format check."
          fi

      - name: Bandit security scan
        run: |
          if find $APP_CHECK_ROOTS -name '*.py' -print -quit | grep -q .; then
            bandit -r $APP_CHECK_ROOTS -ll
          else
            echo "No Python source found under app integration roots; skipping bandit."
          fi

      - name: Run unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/$APP_ROOT:${PYTHONPATH:-}"
          TEST_PATHS=$(find $APP_CHECK_ROOTS -type d -name tests -print)
          TEST_FILES=$(find $APP_CHECK_ROOTS -type f -name 'test_*.py' -print)
          if [ -n "$TEST_PATHS$TEST_FILES" ]; then
            pytest $APP_CHECK_ROOTS -v --tb=short
          else
            echo "No app integration tests found yet; skipping pytest."
          fi

      - name: Gitleaks secret scan
        if: github.event_name != 'workflow_run'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  package-lambdas:
    name: Package Lambda dispatchers
    needs: [detect-changes, lint-test]
    if: |
      needs.detect-changes.outputs.lambdas == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: alert-ingest
            source_dir: alert-ingest
            fallback_dir: ""
            function_suffix: alert-ingest
          - id: context-collector
            source_dir: context-collector
            fallback_dir: ""
            function_suffix: context-collector
          - id: broadcast-notifier
            source_dir: broadcast-notifier
            fallback_dir: ""
            function_suffix: broadcast-notifier
          - id: jira-dispatcher
            source_dir: jira-dispatcher
            fallback_dir: jira-connector
            function_suffix: jira-dispatcher
          - id: notify-dispatcher
            source_dir: notify-dispatcher
            fallback_dir: ""
            function_suffix: notify-dispatcher
          - id: slack-dispatcher
            source_dir: slack-dispatcher
            fallback_dir: slack-notifier
            function_suffix: slack-dispatcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lambda zip
        id: zip
        run: |
          set -euo pipefail
          SRC="$APP_ROOT/${{ matrix.source_dir }}"
          if [ ! -d "$SRC" ] && [ -n "${{ matrix.fallback_dir }}" ]; then
            SRC="$APP_ROOT/${{ matrix.fallback_dir }}"
          fi

          if [ ! -d "$SRC" ] || ! find "$SRC" -type f ! -name '.gitkeep' -print -quit | grep -q .; then
            echo "No source for ${{ matrix.id }}; skipping package."
            echo "artifact=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p build/${{ matrix.id }}/python
          cp -R "$SRC"/. "build/${{ matrix.id }}/"
          if [ -d "$APP_ROOT/shared" ]; then
            cp -R "$APP_ROOT/shared" "build/${{ matrix.id }}/shared"
          fi

          if [ -f "build/${{ matrix.id }}/requirements.txt" ]; then
            python -m pip install -r "build/${{ matrix.id }}/requirements.txt" -t "build/${{ matrix.id }}/"
          fi

          cd "build/${{ matrix.id }}"
          zip -qr "../../${{ matrix.id }}.zip" .
          cd ../..
          echo "artifact=${{ matrix.id }}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload Lambda artifact
        if: steps.zip.outputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ matrix.id }}
          path: ${{ steps.zip.outputs.artifact }}
          retention-days: 7

  deploy-lambdas:
    name: Deploy Lambda dispatchers
    needs: package-lambdas
    if: |
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/main'
        )
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.conclusion == 'success'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.deploy == 'true'
      )
    runs-on: ubuntu-latest
    environment: sandbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: alert-ingest
            function_suffix: alert-ingest
          - id: context-collector
            function_suffix: context-collector
          - id: broadcast-notifier
            function_suffix: broadcast-notifier
          - id: jira-dispatcher
            function_suffix: jira-dispatcher
          - id: notify-dispatcher
            function_suffix: notify-dispatcher
          - id: slack-dispatcher
            function_suffix: slack-dispatcher
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lambda-${{ matrix.id }}
          path: .

      - name: Update Lambda code
        env:
          LAMBDA_PREFIX: ${{ vars.LAMBDA_NAME_PREFIX || 'triage-hub' }}
        run: |
          set -euo pipefail
          ZIP_FILE="${{ matrix.id }}.zip"
          FUNCTION_NAME="$LAMBDA_PREFIX-${{ matrix.function_suffix }}"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "No artifact for ${{ matrix.id }}; skipping deploy."
            exit 0
          fi

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$ZIP_FILE" \
            --publish

          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "Updated $FUNCTION_NAME"

  smoke-test:
    name: Smoke test triage flow
    needs: [deploy-lambdas]
    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/develop' ||
            github.ref == 'refs/heads/main'
          )
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy == 'true'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify API Gateway health
        env:
          TRIAGE_API_URL: ${{ vars.TRIAGE_API_URL }}
        run: |
          if [ -z "$TRIAGE_API_URL" ]; then
            echo "TRIAGE_API_URL is not set; skipping API smoke test."
            exit 0
          fi
          curl --fail --show-error --silent "$TRIAGE_API_URL/healthz"

      - name: Verify SQS buffers and DLQs
        env:
          QUEUE_NAMES: ${{ vars.TRIAGE_QUEUE_NAMES || 'triage-hub-buffer-queue,triage-hub-dispatch-queue,triage-hub-buffer-queue-dlq,triage-hub-dispatch-queue-dlq' }}
        run: |
          IFS=',' read -ra QUEUES <<< "$QUEUE_NAMES"
          for queue in "${QUEUES[@]}"; do
            aws sqs get-queue-url --queue-name "$queue" >/dev/null
            echo "Queue exists: $queue"
          done
