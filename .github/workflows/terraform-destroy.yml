name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
      confirm:
        description: 'Type "destroy-sandbox" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: "1.14.8"

jobs:
  destroy:
    name: Destroy sandbox infrastructure
    if: github.event.inputs.environment == 'sandbox' && github.event.inputs.confirm == 'destroy-sandbox'
    runs-on: ubuntu-latest
    environment: sandbox
    defaults:
      run:
        working-directory: capstone/tf-1/devops/infra/environments/sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug role secret
        run: |
          echo "TF_AWS_ROLE_ARN exists: ${{ secrets.TF_AWS_ROLE_ARN != '' }}"
          echo "Expected role: arn:aws:iam::730335441285:role/triage-hub-github-terraform-role"

      - name: Debug OIDC token claims
        run: |
          token_json="$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(echo "$token_json" | jq -r '.value')"
          payload="$(python3 - "$token" <<'PY'
import base64
import sys

part = sys.argv[1].split(".")[1]
part += "=" * (-len(part) % 4)
print(base64.urlsafe_b64decode(part).decode())
PY
)"
          echo "$payload" | jq '{iss, aud, sub, repository, ref, environment, job_workflow_ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Configure kubeconfig for EKS resources
        continue-on-error: true
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "triage-hub-eks"

      - name: Terraform destroy plan
        run: terraform plan -destroy -no-color -input=false -out=tfdestroy

      - name: Terraform destroy
        run: terraform apply -auto-approve -input=false tfdestroy
