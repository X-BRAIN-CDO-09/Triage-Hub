name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
      confirm:
        description: 'Type "destroy-sandbox" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: "1.14.8"

jobs:
  destroy:
    name: Destroy sandbox infrastructure
    if: github.event.inputs.environment == 'sandbox' && github.event.inputs.confirm == 'destroy-sandbox'
    runs-on: ubuntu-latest
    environment: sandbox
    defaults:
      run:
        working-directory: capstone/tf-1/devops/infra/environments/sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy plan
        run: terraform plan -destroy -no-color -input=false -out=tfdestroy

      - name: Terraform destroy
        run: terraform apply -auto-approve -input=false tfdestroy
